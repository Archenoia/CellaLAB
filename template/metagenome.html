<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宏基因组样本 — Cella LAB</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="page">
    <div id="breadcrumb" class="breadcrumb"></div>
    <div id="detail-head"></div>

    <div class="card">
      <div class="card-head"><h3>菌群群落组成</h3>
        <div class="btn-row right">
          <button class="btn sm" id="btn-pie">饼图</button>
          <button class="btn sm" id="btn-bar">柱状图</button>
        </div>
      </div>
      <div class="card-body flush"><div id="chart-comp" class="chart"></div></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>MAGs 层次聚类树</h3><span class="sub">基于平均核苷酸一致性（ANI）的聚类</span></div>
      <div class="card-body flush"><div id="chart-tree" class="chart tall"></div></div>
    </div>

    <div class="chart-row">
      <div class="card">
        <div class="card-head"><h3>注释基因列表</h3></div>
        <div class="card-body flush"><div id="gene-table"></div></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>相关通路列表</h3></div>
        <div class="card-body flush"><div id="pathway-table"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>注释基因主题词云</h3><span class="sub">词频映射字号</span></div>
      <div class="card-body flush"><div id="chart-word" class="chart"></div></div>
    </div>
  </main>

  <script src="vendor/echarts/echarts.min.js"></script>
  <script src="vendor/echarts-wordcloud/echarts-wordcloud.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/metagenome.js"></script>
</body>
</html>
