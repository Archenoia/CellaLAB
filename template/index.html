<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cella LAB — 合成菌群数据库</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>Cella LAB 微生物实验室</h1>
      <p class="lead">面向合成菌群设计的综合数据库：整合合成菌群配方、宏基因组测序结果、泛基因组分析与代谢通路，为合成菌群的功能来源与设计理论提供系统性支撑。</p>
      <form class="search-hero" onsubmit="return CellaApp._navSearch(this)">
        <input type="text" name="q" placeholder="搜索合成菌群、物种、基因、样本、酶或通路…">
        <button type="submit">搜索</button>
      </form>
    </section>

    <section class="stat-strip" id="stat-strip">
      <div class="loading">统计信息加载中…</div>
    </section>

    <div class="section-title"><h2>数据模块</h2></div>
    <div class="module-grid" id="module-grid"></div>

    <div class="section-title"><h2>数据概览</h2></div>
    <div class="chart-row">
      <div class="card"><div class="card-head"><h3 id="pie-title">功能分类</h3></div><div class="card-body flush"><div id="chart-pie" class="chart"></div></div></div>
      <div class="card"><div class="card-head"><h3 id="bar-title">环境分布</h3></div><div class="card-body flush"><div id="chart-bar" class="chart"></div></div></div>
    </div>

    <div class="section-title"><h2>最新收录</h2></div>
    <div class="card"><div class="card-body flush"><div id="latest"></div></div></div>
  </main>

  <script src="vendor/echarts/echarts.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
