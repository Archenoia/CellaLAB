<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索 — Cella LAB</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="page-narrow">
    <div class="section-title"><h2 style="text-align:center;width:100%">数据库搜索</h2></div>
    <form class="search-hero" onsubmit="return CellaApp._navSearch(this)" style="margin-bottom:30px">
      <input type="text" name="q" id="q-input" placeholder="输入关键词，如 butyrate, F. prausnitzii, PWY-567…">
      <button type="submit">检索</button>
    </form>

    <div class="section-title"><h3>热门搜索</h3></div>
    <div id="hotwords" style="display:flex;flex-wrap:wrap;gap:10px">
      <div class="loading">热词加载中…</div>
    </div>

    <div class="card" style="margin-top:30px">
      <div class="card-head"><h3>检索范围说明</h3></div>
      <div class="card-body">
        <p class="muted small">Cella LAB 支持跨以下六类数据的统一检索：</p>
        <ul class="small muted">
          <li><b style="color:#20558a">合成菌群</b>：已发表或行业产品记录的功能菌群配方</li>
          <li><b style="color:#3a8f5f">物种分类</b>：菌株、物种与分类学层级</li>
          <li><b style="color:#8f3a3a">基因</b>：注释基因及其序列、结构域</li>
          <li><b style="color:#c1873b">环境样本</b>：宏基因组样本及环境信息</li>
          <li><b style="color:#5f5f8f">酶</b>：功能酶与 EC 编号</li>
          <li><b style="color:#3a7f8f">代谢通路</b>：通路、代谢物与反应</li>
        </ul>
      </div>
    </div>
  </main>

  <script src="vendor/echarts/echarts.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
