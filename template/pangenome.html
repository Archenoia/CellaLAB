<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>泛基因组分析 — Cella LAB</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="page">
    <div id="breadcrumb" class="breadcrumb"></div>
    <div id="detail-head"></div>

    <div class="card">
      <div class="card-head"><h3>基因家族分类组成比例</h3>
        <div class="btn-row right">
          <button class="btn sm" id="btn-pie">饼图</button>
          <button class="btn sm" id="btn-bar">条形图</button>
        </div>
      </div>
      <div class="card-body flush"><div id="chart-fam" class="chart"></div></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>泛基因组曲线</h3><span class="sub">累积基因数（pan）与核心基因数（core）</span></div>
      <div class="card-body flush"><div id="chart-curve" class="chart"></div></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>PAV 矩阵（存在/缺失）</h3><span class="sub">每行一个基因家族，每列一个基因组</span></div>
      <div class="card-body flush"><div id="chart-pav" class="chart tall"></div></div>
    </div>

    <div class="chart-row">
      <div class="card">
        <div class="card-head"><h3>结构变异（SV）类型分布</h3></div>
        <div class="card-body flush"><div id="chart-sv" class="chart short"></div></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>共线性分析</h3><span class="sub">两基因组同源基因块比对</span></div>
        <div class="card-body flush"><div id="chart-synteny" class="chart short"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>结构变异明细</h3></div>
      <div class="card-body flush"><div id="sv-table"></div></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>基因家族详细结果</h3></div>
      <div class="card-body flush"><div id="family-table"></div></div>
    </div>
  </main>

  <script src="vendor/echarts/echarts.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pangenome.js"></script>
</body>
</html>
