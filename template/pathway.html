<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代谢通路 — Cella LAB</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="page">
    <div id="breadcrumb" class="breadcrumb"></div>
    <div id="detail-head"></div>

    <div class="card">
      <div class="card-head"><h3>代谢网络可视化</h3><span class="sub">代谢物节点与反应边</span></div>
      <div class="card-body flush"><div id="chart-net" class="chart tall"></div></div>
    </div>

    <div class="chart-row">
      <div class="card">
        <div class="card-head"><h3>上游通路</h3></div>
        <div class="card-body flush"><div id="upstream"></div></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>下游通路</h3></div>
        <div class="card-body flush"><div id="downstream"></div></div>
      </div>
    </div>

    <div class="chart-row">
      <div class="card">
        <div class="card-head"><h3>基因列表</h3></div>
        <div class="card-body flush"><div id="gene-table"></div></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>代谢物列表</h3></div>
        <div class="card-body flush"><div id="metabolite-table"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>代谢反应列表</h3></div>
      <div class="card-body flush"><div id="reaction-table"></div></div>
    </div>

    <div class="chart-row">
      <div class="card">
        <div class="card-head"><h3>关联合成菌群</h3></div>
        <div class="card-body flush"><div id="assoc-consort"></div></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>关联宏基因组样本</h3></div>
        <div class="card-body flush"><div id="assoc-sample"></div></div>
      </div>
    </div>
  </main>

  <script src="vendor/echarts/echarts.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pathway.js"></script>
</body>
</html>
