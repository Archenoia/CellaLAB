<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基因 — Cella LAB</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="page">
    <div id="breadcrumb" class="breadcrumb"></div>
    <div id="detail-head"></div>

    <div class="card">
      <div class="card-head"><h3>蛋白质结构组成（PFAM 结构域）</h3><span class="sub">水平条带图，按 Pfam 家族着色</span></div>
      <div class="card-body flush"><div id="chart-pfam" class="chart short"></div></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>代表性基因序列</h3><span class="sub">FASTA 格式，碱基着色（A/T/G/C）</span></div>
      <div class="card-body"><div id="fasta" class="fasta"></div></div>
    </div>

    <div class="chart-row">
      <div class="card">
        <div class="card-head"><h3>关联菌株 / 样本 / 菌群</h3></div>
        <div class="card-body">
          <h4 style="margin-top:0">关联菌株</h4><div id="strains"></div>
          <h4>关联宏基因组样本</h4><div id="samples"></div>
          <h4>关联合成菌群</h4><div id="consorts"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>所处通路</h3></div>
        <div class="card-body flush"><div id="pathway-table"></div></div>
      </div>
    </div>
  </main>

  <script src="vendor/echarts/echarts.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/gene.js"></script>
</body>
</html>
